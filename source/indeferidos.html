    <style>
:root {

            --cor-secundaria: #009ce0;
            --cor-destaque: #fbbf24;
            --navy-profundo: #0f2d5c;
            --fundo-pagina: #f8fafc;

        .card { background: var(--fundo-card); padding: 18px; border-radius: var(--radius-lg); box-shadow: var(--sombra-card); border: 1px solid var(--borda-leve); transition: transform 0.2s ease, box-shadow 0.2s ease; position: relative; display: flex; flex-direction: column; height: 100%; }

        .seta { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.9); color: var(--navy-profundo); border: 1px solid rgba(0,0,0,0.06); width: 30px; height: 30px; padding: 0; cursor: pointer; border-radius: 999px; font-size: 12px; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; z-index: 10; backdrop-filter: blur(8px); box-shadow: 0 2px 6px rgba(0,0,0,0.1); line-height: 1; }

        .lightbox { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.92); align-items: center; justify-content: center; flex-direction: column; backdrop-filter: blur(12px); }
        .lightbox img { max-width: 90%; max-height: 90%; border-radius: var(--radius-lg); box-shadow: 0 20px 60px rgba(0,0,0,0.5); object-fit: contain; }

        .lbox-seta { position: fixed; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.12); color: white; border: 1px solid rgba(255,255,255,0.15); padding: 12px 16px; cursor: pointer; border-radius: 999px; font-size: 16px; transition: 0.2s; z-index: 10001; backdrop-filter: blur(8px); }

        .detalhes { font-size: 13px; margin-bottom: 8px; line-height: 1.7; color: var(--texto-secundario); }
        .tag-local { display: inline-flex; align-items: center; gap: 5px; background: #f0f9ff; color: #0284c7; padding: 4px 10px; border-radius: 999px; font-weight: 600; margin-bottom: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border: 1px solid #bae6fd; width: fit-content; }

        .detalhes strong { color: var(--texto-principal); font-weight: 600; }

        .texto-expansivel { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .texto-expansivel.linha-unica { -webkit-line-clamp: 1; }
        .texto-expansivel.expandido { -webkit-line-clamp: unset; display: block; overflow: visible; }
.card-footer { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--borda-leve); }
        .botao-ler-mais { display: inline-block; margin: 4px 0 0 0; padding: 0; border: none; background: none; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; color: #2563eb; line-height: 1.4; }

        .tag-prioridade { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; border: 1px solid transparent; }

        select { width: 100%; height: 34px; padding: 0 10px; margin-bottom: 10px; font-size: 12px; border-radius: var(--radius); border: 1px solid var(--borda-leve); font-weight: 500; font-family: 'Inter', sans-serif; color: var(--texto-principal); background-color: #ffffff; transition: border-color 0.2s ease, box-shadow 0.2s ease; outline: none; cursor: pointer; }
        select:focus { border-color: #3b82f6; box-shadow: var(--ring-focus); }

        button.btn-salvar { width: 100%; height: 36px; background-color: var(--navy-profundo); color: white; border: none; border-radius: var(--radius); cursor: pointer; font-weight: 600; font-size: 14px; font-family: 'Inter', sans-serif; transition: all 0.2s ease; }

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzdFNFDHAJi19gOIPye6vR_eqeQgfbsRuSagL4ql414kDjSsfye7EPBljYqg0gHoknK/exec';
        // GET com retentativa automatica: o Apps Script falha de forma intermitente (404/cold start).
        // Vale so para GETs da API; POSTs passam direto, sem retry. O AbortController de cada
        // chamada continua valendo como limite total.
        (function () {
            const fetchOriginal = window.fetch.bind(window);
            window.fetch = function (url, opcoes) {
                const ehApi = String(url).indexOf(API_URL) !== -1;
                const metodo = ((opcoes && opcoes.method) || 'GET').toUpperCase();
                if (!ehApi || metodo !== 'GET') {
                    return fetchOriginal(url, opcoes);
                }
                const sinalExterno = opcoes && opcoes.signal;
                let tentativa = 0;
                function tentar() {
                    tentativa++;
                    const controlador = new AbortController();
                    const limite = setTimeout(function () { controlador.abort(); }, 30000);
                    if (sinalExterno) {
                        if (sinalExterno.aborted) {
                            clearTimeout(limite);
                            controlador.abort();
                        } else {
                            sinalExterno.addEventListener('abort', function () { controlador.abort(); }, { once: true });
                        }
                    }
                    return fetchOriginal(url, { signal: controlador.signal }).then(function (res) {
                        clearTimeout(limite);
                        if (!res.ok && tentativa < 3) return tentar();
                        return res;
                    }).catch(function (err) {
                        clearTimeout(limite);
                        if (sinalExterno && sinalExterno.aborted) throw err;
                        if (tentativa < 3) return tentar();
                        throw err;
                    });
                }
                return tentar();
            };
        })();
        const CACHE_KEY = 'dmae_cache';
        const CACHE_TTL = 3600000;

        function limparSessaoLocal() {
            try {
                [localStorage, sessionStorage].forEach(storage => {
                    const chavesParaRemover = [];
                    for (let i = 0; i < storage.length; i++) {
                        const chave = storage.key(i);
                        if (chave && chave.startsWith('sb-')) chavesParaRemover.push(chave);
                        if (chave && chave.indexOf('supabase') !== -1) chavesParaRemover.push(chave);
                    }
                    chavesParaRemover.forEach(chave => storage.removeItem(chave));
                });
                localStorage.removeItem('dmae_cache');
                localStorage.removeItem('supabase_nome_usuario');
            } catch (e) {}
        }

        async function logout() {
            limparSessaoLocal();
            try {
                if (window.supabase && typeof window.supabase.createClient === 'function') {
                    try {
                        const cliente = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                        await cliente.auth.signOut();
                    } catch (e) {}
                }
            } catch (e) {}
            limparSessaoLocal();
            window.location.replace('login.html');
        }

        function getCache() {
            try { const r = localStorage.getItem(CACHE_KEY); if (!r) return null; const c = JSON.parse(r); if (Date.now() - c.timestamp > CACHE_TTL) return null; return c.data; } catch { return null; }
        }
        function setCache(data) {
            try { localStorage.setItem(CACHE_KEY, JSON.stringify({ timestamp: Date.now(), data })); } catch {}
        }
        function atualizarCacheLocal(itemAtualizado) {
            try {
                const cache = getCache();
                if (!cache || !itemAtualizado) return;
                const idx = cache.findIndex(d => d.rowNumber === itemAtualizado.rowNumber);
                if (idx !== -1) cache[idx] = itemAtualizado;
                setCache(cache);
            } catch {}
        }

        const controleCarrossel = {};
        let filtroPrioridade = 'todas';
        let ordemAscendente = true;
        let todosDados = [];

        function statusDoItem(item) {
            if (item.status) return item.status;
            if (item.prioridade) return 'Planejamento';
            return 'Pendente';
        }

        function atualizarBadges(dados) {
            const visiveis = filtrarPorArea(dados);
            document.getElementById('badge-pendentes').textContent = visiveis.filter(i => i.nome && statusDoItem(i) === 'Pendente').length;
            document.getElementById('badge-planejamento').textContent = visiveis.filter(i => i.nome && statusDoItem(i) === 'Planejamento').length;
            document.getElementById('badge-tratativa').textContent = visiveis.filter(i => i.nome && statusDoItem(i) === 'Em Tratativa').length;
            document.getElementById('badge-execucao').textContent = visiveis.filter(i => i.nome && statusDoItem(i) === 'Em Execução').length;
            document.getElementById('badge-concluidos').textContent = visiveis.filter(i => i.nome && statusDoItem(i) === 'Concluído').length;
            document.getElementById('badge-indeferidos').textContent = visiveis.filter(i => i.nome && statusDoItem(i) === 'Indeferido').length;
            document.querySelectorAll('.nav-tab .badge').forEach(b => b.classList.toggle('vazio', !b.textContent || b.textContent === '0'));
        }

        function alterarOrdem(ascendente) {
            ordemAscendente = ascendente;
            document.getElementById('btn-asc').classList.toggle('ativo', ascendente);
            document.getElementById('btn-desc').classList.toggle('ativo', !ascendente);
            renderizarResultados();
        }

        let lightboxAtivo = null;

        function abrirDetalhe(rowNumber, event) {
            if (event) event.stopPropagation();
            window.location.href = 'detalhe.html?row=' + rowNumber;
        }
        function abrirLightbox(rowNumber) {
            const estado = controleCarrossel[rowNumber];
            if (!estado) return;
            lightboxAtivo = rowNumber;
            const temVarias = estado.imagens.length > 1;
            document.getElementById('imgLightbox').src = estado.imagens[estado.index];
            document.getElementById('lbox-anterior').style.display = temVarias ? '' : 'none';
            document.getElementById('lbox-proxima').style.display = temVarias ? '' : 'none';
            document.getElementById('meuLightbox').style.display = 'flex';
        }

        function fecharLightbox() {
            lightboxAtivo = null;
            document.getElementById('meuLightbox').style.display = 'none';
        }

        function mudarImagemLightbox(direcao, event) {
            event.stopPropagation();
            if (lightboxAtivo === null) return;
            const estado = controleCarrossel[lightboxAtivo];
            if (!estado) return;
            estado.index += direcao;
            if (estado.index >= estado.imagens.length) estado.index = 0;
            if (estado.index < 0) estado.index = estado.imagens.length - 1;
            document.getElementById('imgLightbox').src = estado.imagens[estado.index];
            const thumb = document.getElementById(`img-${lightboxAtivo}`);
            if (thumb) thumb.src = estado.imagens[estado.index];
            const contador = document.getElementById(`contador-${lightboxAtivo}`);
            if (contador) contador.innerText = `${estado.index + 1} / ${estado.imagens.length}`;
        }

        function precarregarImagens(listaImagens) {
            if (!listaImagens || !listaImagens.length) return;
            listaImagens.forEach(url => {
                const img = new Image();
                img.referrerPolicy = 'no-referrer';
                img.src = url;
            });
        }

function processarImagens(urlsFormulario) {
            if (!urlsFormulario || urlsFormulario.toString().trim() === "") {
                return ['https://placehold.co/400x300/f8fafc/94a3b8?text=Sem+Imagem+Anexada'];
            }
            const links = urlsFormulario.toString().split(',');
            const imagensExtraidas = [];
            links.forEach(link => {
                const linkLimpo = link.trim();
                let idMatch = linkLimpo.match(/id=([a-zA-Z0-9_-]+)/) || linkLimpo.match(/d\/([a-zA-Z0-9_-]+)/) || linkLimpo.match(/open\?id=([a-zA-Z0-9_-]+)/);
                if (idMatch && idMatch[1]) {
                    imagensExtraidas.push(`https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=w1000`);
                }
            });
            return imagensExtraidas.length > 0 ? imagensExtraidas : ['https://placehold.co/400x300/fee2e2/ef4444?text=Erro+no+Link'];
        }

        function mudarImagem(rowNumber, direcao, event) {
            event.stopPropagation();
            const estado = controleCarrossel[rowNumber];
            estado.index += direcao;
            if (estado.index >= estado.imagens.length) estado.index = 0;
            if (estado.index < 0) estado.index = estado.imagens.length - 1;
            document.getElementById(`img-${rowNumber}`).src = estado.imagens[estado.index];
            document.getElementById(`contador-${rowNumber}`).innerText = `${estado.index + 1} / ${estado.imagens.length}`;
        }

        function classePrioridade(prioridade) {
            const mapa = { 'Emergencial': 'emergencial', 'Média': 'media', 'Baixa': 'baixa' };
            return mapa[prioridade] || '';
        }

        function iconePrioridade(prioridade) {
            const mapa = { 'Emergencial': '🔴', 'Média': '🟡', 'Baixa': '🟢' };
            return mapa[prioridade] || '';
        }

        function formatarData(valor) {
            if (!valor) return 'Não informado';
            const str = String(valor).trim();
            const m = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (m) return `${m[3]}/${m[2]}/${m[1]}`;
            const d = new Date(str);
            return isNaN(d) ? str : d.toLocaleDateString('pt-BR');
        }

        function montarCard(item) {
            const dataFormatada = new Date(item.dataHora).toLocaleDateString('pt-BR');
            const listaImagens = processarImagens(item.imagens);
            precarregarImagens(listaImagens);
            const prioridade = item.prioridade;
            const prioClasse = classePrioridade(prioridade);

            controleCarrossel[item.rowNumber] = { imagens: listaImagens, index: 0 };

            let imgHTML = `<div class="carrossel"><button type="button" class="btn-detalhe" title="Abrir detalhes do chamado" onclick="abrirDetalhe(${item.rowNumber}, event)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg><span>Ver detalhes</span></button>`;
            if (listaImagens.length > 1) imgHTML += `<button class="seta seta-esq" onclick="mudarImagem(${item.rowNumber}, -1, event)">&#10094;</button>`;
            imgHTML += `<img id="img-${item.rowNumber}" src="${listaImagens[0]}" alt="Imagem" referrerpolicy="no-referrer" onclick="abrirLightbox(${item.rowNumber})">`;
            if (listaImagens.length > 1) imgHTML += `<button class="seta seta-dir" onclick="mudarImagem(${item.rowNumber}, 1, event)">&#10095;</button>
                <div class="contador-img" id="contador-${item.rowNumber}">1 / ${listaImagens.length}</div>`;
            imgHTML += `</div>`;

            const card = document.createElement('div');
            card.className = 'card';
            card.setAttribute('data-prioridade', prioridade);
            card.innerHTML = `${imgHTML}
                <div class="detalhes">
                    <span class="tag-concluido">🚫 Indeferido</span>
                    <span class="tag-prioridade ${prioClasse}">${iconePrioridade(prioridade)} ${prioridade}</span>
                    <span class="tag-local">${item.id ? 'ID ' + item.id + ' · ' : ''}${item.local}</span>
                    <div><strong>Solicitante:</strong> ${item.nome} (${dataFormatada})</div>
                    <div style="margin-top: 8px;"><strong>Objeto:</strong> ${item.objeto}</div>
                    <div class="texto-expansivel" style="margin-top: 8px;"><strong>Motivo:</strong> ${item.motivo}</div>
                    ${item.observacaoAdicional ? `<div class="texto-expansivel linha-unica" style="margin-top: 8px;"><strong>Observação / Detalhamento Adicional:</strong> ${item.observacaoAdicional}</div>` : ''}
                    <div style="margin-top: 10px; padding: 12px; background: #f8fafc; border-radius: 10px; border: 1px solid #e2e8f0;">
                        <strong>📝 Motivo do indeferimento:</strong><br>
                        <span style="font-size: 14px; color: var(--texto-secundario);">${item.motivoIndeferido || 'Não informado'}</span>
                    </div>
                </div>
                <div class="bloco-info">
                    <h4>🔍 Classificação</h4>
                    <div class="linha"><strong>Área:</strong> ${item.area || 'Não informada'}</div>
                    <div class="linha"><strong>Prioridade:</strong> ${prioridade}</div>
                    <div class="linha"><strong>Quem classificou:</strong> ${item.classificadoPor || 'Não informado'}</div>
                </div>
                <button type="button" class="btn-reabrir" onclick="reabrirChamado(${item.rowNumber}, this, 'Planejamento')">↩ Reabrir para Planejamento</button>`;
            return card;
        }

        async function reabrirChamado(rowNumber, btnElement, destino) {
            const etapa = destino === 'Em Execução' ? 'a Execução' : 'o Planejamento';
            if (!confirm('Reabrir este chamado? Ele voltará para ' + etapa + '.')) return;

            const item = todosDados.find(d => d.rowNumber === rowNumber);
            const statusOriginal = item ? item.status : null;

            if (item) {
                item.status = destino;
                atualizarCacheLocal(item);
            }
            atualizarBadges(todosDados);

            const cardElement = btnElement.closest('.card');
            if (cardElement) {
                cardElement.style.transition = "opacity 0.4s ease, transform 0.4s ease";
                cardElement.style.opacity = "0";
                cardElement.style.transform = "scale(0.9)";
                cardElement.style.pointerEvents = "none";
            }

            try {
                const controlador = new AbortController();
                const timeout = setTimeout(() => controlador.abort(), 30000);

                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'reabrir',
                        rowNumber: rowNumber,
                        destino: destino,
                        usuario: obterNomeUsuario() || ''
                    }),
                    headers: { 'Content-Type': 'text/plain' },
                    signal: controlador.signal
                });
                clearTimeout(timeout);

                const corpo = await res.text();
                let dados = null;
                try { dados = JSON.parse(corpo); } catch (e) {}
                if (!res.ok || !dados || dados.status !== 'sucesso') {
                    throw new Error(dados && dados.mensagem ? dados.mensagem : 'O Google Sheets não confirmou a reabertura.');
                }

                setTimeout(() => {
                    if (cardElement) cardElement.remove();
                    const container = document.getElementById('container');
                    if (container && container.querySelectorAll('.card').length === 0) {
                        renderizarResultados();
                    }
                }, 400);
            } catch (erro) {
                if (item && statusOriginal !== null) {
                    item.status = statusOriginal;
                    atualizarCacheLocal(item);
                }
                atualizarBadges(todosDados);
                renderizarResultados();
                const msg = erro.name === 'AbortError'
                    ? "O Google Sheets não respondeu em 30s. A reabertura pode não ter sido salva. Tente novamente."
                    : (erro.message || "Erro ao reabrir o chamado. Verifique sua internet.");
                alert(msg);
            }
        }
        function aplicarFiltro(prioridade) {
            filtroPrioridade = prioridade;
            document.querySelectorAll('.filtro-btn').forEach(btn => {
                btn.classList.toggle('ativo', btn.dataset.filtro === prioridade);
            });
            renderizarResultados();
        }

        function renderizarResultados() {
            const container = document.getElementById('container');

            const todosIndeferidos = FiltroPeriodo.filtrar(filtrarPorArea(todosDados)).filter(item =>
                item.nome && statusDoItem(item) === 'Indeferido'
            );
            todosIndeferidos.sort((a, b) => {
                const da = new Date(a.dataHora);
                const db = new Date(b.dataHora);
                return ordemAscendente ? da - db : db - da;
            });

            if (todosIndeferidos.length === 0) {
                container.innerHTML = '<div class="status-msg">Nenhum chamado indeferido encontrado.</div>';
                return;
            }

            let pillsHtml = `<div class="filtro-container">
                <button class="filtro-btn ativo" data-filtro="todas">
                    Indeferidos <span class="filtro-count todas">${todosIndeferidos.length}</span>
                </button>
            </div>`;
            document.getElementById('pills-container').innerHTML = pillsHtml;

            container.innerHTML = '';

            const gridContainer = document.createElement('div');
            gridContainer.className = 'grid';
            todosIndeferidos.forEach(item => gridContainer.appendChild(montarCard(item)));
            container.appendChild(gridContainer);
            configurarLerMais();
        }

        async function carregarIndeferidos() {
            const container = document.getElementById('container');
            const statusMsg = document.getElementById('mensagem-status');

            const cache = getCache();
            if (cache) {
                todosDados = cache;
                FiltroPeriodo.preencherMes(todosDados);
                renderizarResultados();
                atualizarBadges(todosDados);
                if (statusMsg) statusMsg.style.display = 'none';
            } else {
                if (statusMsg) statusMsg.innerHTML = 'Carregando<span class="loading-dots"></span>';
            }

            try {
                const controlador = new AbortController();
                const timeout = setTimeout(() => controlador.abort(), 45000);

                const response = await fetch(API_URL, { signal: controlador.signal });
                const dados = await response.json();
                clearTimeout(timeout);
                setCache(dados);
                todosDados = dados;
                FiltroPeriodo.preencherMes(todosDados);
                renderizarResultados();
                atualizarBadges(todosDados);
                if (statusMsg) statusMsg.style.display = 'none';
            } catch (error) {
                clearTimeout(timeout);
                if (!cache) container.innerHTML = `<div class="status-msg" style="color: #ef4444;">Erro ao carregar indeferidos.<br><br><span style="font-size:14px;font-weight:normal;">O Google Sheets está demorando para responder. Aguarde e tente novamente.</span><br><br><button class="sort-btn" style="padding:12px 30px;" onclick="carregarIndeferidos()">Tentar novamente</button></div>`;
            }
        }

        function dadosSaoIguais(a, b) {
            if (!a || !b || a.length !== b.length) return false;
            for (let i = 0; i < a.length; i++) {
                const x = a[i], y = b[i];
                if (!x || !y) return false;
                if (x.rowNumber !== y.rowNumber ||
                    x.status !== y.status ||
                    x.prioridade !== y.prioridade)
                    return false;
            }
            return true;
        }

        let pollingEmAndamento = false;
        async function atualizarEmTempoReal() {
            if (pollingEmAndamento) return;
            pollingEmAndamento = true;
            try {
                const response = await fetch(API_URL);
                const novosDados = await response.json();
                if (!dadosSaoIguais(novosDados, todosDados)) {
                    setCache(novosDados);
                    todosDados = novosDados;
                    renderizarResultados();
                    atualizarBadges(todosDados);
                }
            } catch (e) {
            } finally {
                pollingEmAndamento = false;
            }
        }

        FiltroPeriodo.registrarCallback(function() {
            renderizarResultados();
            atualizarBadges(todosDados);
        });
        FiltroPeriodo.restaurar();
        FiltroPeriodo.restaurarUI();
        carregarIndeferidos();
        setInterval(atualizarEmTempoReal, 15000);
    

        function configurarLerMais() {
            document.querySelectorAll('.texto-expansivel').forEach(function(el) {
                if (el.getAttribute('data-lermais') === '1') return;
                if (el.scrollHeight <= el.clientHeight + 4) return;
                var botao = document.createElement('button');
                botao.type = 'button';
                botao.className = 'botao-ler-mais';
                botao.textContent = 'Ler mais';
                botao.setAttribute('data-expandido', 'false');
                botao.addEventListener('click', function() {
                    var expandido = botao.getAttribute('data-expandido') === 'true';
                    if (expandido) {
                        el.classList.remove('expandido');
                        botao.textContent = 'Ler mais';
                        botao.setAttribute('data-expandido', 'false');
                    } else {
                        el.classList.add('expandido');
                        botao.textContent = 'Ler menos';
                        botao.setAttribute('data-expandido', 'true');
                    }
                });
                el.insertAdjacentElement('afterend', botao);
                el.setAttribute('data-lermais', '1');
            });
        }
</script>
